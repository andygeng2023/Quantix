name: Deploy Quantix
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy application without replacing the generated market cache
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.INFINITYFREE_FTP_SERVER }}
          username: ${{ secrets.INFINITYFREE_FTP_USERNAME }}
          password: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
          server-dir: ${{ secrets.INFINITYFREE_FTP_SERVER_DIR }}
          protocol: ftp
          local-dir: ./web/
          # market.json is generated by Quantix Data Refresh and uploaded separately.
          # Never let a normal code deployment replace it with the repository's empty placeholder.
          exclude: |
            **/data/market.json
