name: Quantix Data Collector
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    concurrency:
      group: quantix-data-collector
      cancel-in-progress: true
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r collector/requirements.txt requests
      - name: Fetch yfinance data
        env:
          QUANTIX_SYMBOLS: ${{ vars.QUANTIX_SYMBOLS }}
          QUANTIX_INGEST_URL: ${{ secrets.QUANTIX_INGEST_URL }}
          QUANTIX_INGEST_TOKEN: ${{ secrets.QUANTIX_INGEST_TOKEN }}
        run: python collector/fetch_prices.py
      - name: Verify generated cache
        run: python - <<'PY'
import json
p='web/data/market.json'
d=json.load(open(p))
assert len(d.get('stocks',[])) >= 400, f"Universe unexpectedly small: {len(d.get('stocks',[]))}"
assert len(d.get('analysis',{})) >= 400, f"Analysis unexpectedly small: {len(d.get('analysis',{}))}"
print('Verified',len(d['stocks']),'stocks and',len(d['analysis']),'analyses')
PY
      - name: Publish static market cache
        run: |
          git config user.name "Quantix Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add web/data/market.json
          git diff --cached --quiet || git commit -m "Update Quantix market cache"
          git push

      - name: Deploy market cache directly to InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.INFINITYFREE_FTP_SERVER }}
          username: ${{ secrets.INFINITYFREE_FTP_USERNAME }}
          password: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
          server-dir: ${{ secrets.INFINITYFREE_FTP_SERVER_DIR }}data/
          protocol: ftp
          local-dir: ./web/data/
