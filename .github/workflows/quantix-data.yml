name: Quantix Data Refresh
run-name: Quantix market refresh
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: quantix-data-refresh
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - name: Install collector
        run: pip install -r collector/requirements.txt requests
      - name: Generate market cache
        env:
          QUANTIX_SYMBOLS: ${{ vars.QUANTIX_SYMBOLS }}
        run: python collector/fetch_prices.py
      - name: Validate cache
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('web/data/market.json').read_text())
          stocks=d.get('stocks',[])
          analysis=d.get('analysis',{})
          prices=d.get('prices',[])
          assert len(stocks) >= 400, f"Universe unexpectedly small: {len(stocks)}"
          assert len(analysis) >= 400, f"Analysis unexpectedly small: {len(analysis)}"
          assert len(prices) >= 100000, f"Price history unexpectedly small: {len(prices)}"
          assert d.get('generated_at'), "Missing generated_at"
          print(f"Validated {len(stocks)} stocks, {len(analysis)} analyses and {len(prices)} price rows")
          PY
      - name: Deploy cache to InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.INFINITYFREE_FTP_SERVER }}
          username: ${{ secrets.INFINITYFREE_FTP_USERNAME }}
          password: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
          server-dir: ${{ secrets.INFINITYFREE_FTP_SERVER_DIR }}data/
          protocol: ftp
          local-dir: ./web/data/
          exclude: |
            **/.DS_Store
